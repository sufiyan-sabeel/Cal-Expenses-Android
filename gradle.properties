org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=320m -XX:CompressedClassSpaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:+UseParallelGC

systemProp.http.proxyHost=egress-proxy.sandbox.internal
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=egress-proxy.sandbox.internal
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.0.0.1
